name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright

      - name: Compile Python sources
        run: python -m compileall -q app.py argument_engine tests

      - name: Run smoke tests
        run: pytest -q tests/test_app_smoke.py

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start Dash server
        run: |
          mkdir -p artifacts
          python app.py > artifacts/server.log 2>&1 &
          echo $! > /tmp/ndsa-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8050/_dash-layout > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/server.log
          exit 1

      - name: Render visualization in Chromium
        run: python tests/browser_smoke.py

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke
          path: artifacts/
          if-no-files-found: error
